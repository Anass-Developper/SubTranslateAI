name: Publier SubTranslateAI pour Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# À configurer dans Settings > Secrets and variables > Actions :
# - variable RELEASES_REPOSITORY : proprietaire/SubTranslateAI-releases
# - secret RELEASES_TOKEN : jeton finement limité à ce seul dépôt (Contents: write)

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la configuration de publication
        shell: pwsh
        env:
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY }}
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if ($env:RELEASES_REPOSITORY -notmatch '^[\w.-]+/[\w.-]+$') {
            throw 'La variable RELEASES_REPOSITORY doit valoir proprietaire/depot.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RELEASES_TOKEN)) {
            throw 'Le secret RELEASES_TOKEN est absent.'
          }
          $version = node -p "require('./apps/desktop/package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Le tag $env:GITHUB_REF_NAME ne correspond pas à apps/desktop/package.json ($version)."
          }

      - name: Vérifier le projet
        run: npm run check

      - name: Construire l’installateur et les métadonnées de mise à jour
        env:
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY }}
        run: npm run package:windows

      - name: Publier dans le dépôt public réservé aux binaires
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RELEASES_REPOSITORY: ${{ vars.RELEASES_REPOSITORY }}
        run: |
          $installer = (Get-ChildItem 'release/desktop/SubTranslateAI-Setup-*.exe' | Select-Object -First 1).FullName
          $blockmap = (Get-ChildItem 'release/desktop/SubTranslateAI-Setup-*.exe.blockmap' | Select-Object -First 1).FullName
          gh release create "$env:GITHUB_REF_NAME" `
            "$installer" `
            "$blockmap" `
            "release/desktop/latest.yml" `
            --repo "$env:RELEASES_REPOSITORY" `
            --generate-notes `
            --title "SubTranslateAI $env:GITHUB_REF_NAME"
